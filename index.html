        // Variable to store loaded tags

        const tagColors = [
            'bg-primary-100 text-primary-800 border-primary-300',
            'bg-purple-100 text-purple-800 border-purple-300',
            'bg-pink-100 text-pink-800 border-pink-300',

            'bg-cyan-100 text-cyan-800 border-cyan-300',
        ];

        // Variable to store tag color map
        let tagColorMap = {};

        // Render available tags
        function renderTags(tagsData) {
            const preTrainedTagsDiv = document.getElementById('pre-trained_tags');
            if (!preTrainedTagsDiv) return;

            // Clear existing tags
            preTrainedTagsDiv.innerHTML = '';
            tagColorMap = {};

            Object.keys(tagsData).forEach((key, index) => {
                const colorClass = tagColors[index % tagColors.length];
                tagColorMap[key] = colorClass;
                
                const tagElement = document.createElement('span');
                tagElement.className = `inline-flex items-center px-4 py-2 rounded-lg text-sm font-medium border ${colorClass} transition-all duration-200 cursor-pointer transform shadow-sm`;
                tagElement.textContent = key;
                preTrainedTagsDiv.appendChild(tagElement);
            });
            
            const availableTagCount = document.getElementById('availableTagCount');
            if (availableTagCount) {
                availableTagCount.textContent = Object.keys(tagsData).length;
            }
        }

                const response = await fetch('tags.json');
                if (response.ok) {
                    const jsonTags = await response.json();
                    tags = jsonTags;
                    console.log('Tags loaded from tags.json');
                    renderTags(tags);
                } else {
                    console.log('tags.json not found, using default tags');
                    renderTags(defaultTags);
                }
            } catch (error) {
                console.log('Error loading tags.json, using default tags:', error);
                renderTags(defaultTags);
            }
        }

        // Load tags on page load
        loadTags();

        // Constants
        const SILENCE_TIMEOUT_MS = 2000;

        // Utility function to escape HTML and prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Detect tags function
        function detectTags() {
            const textInput = document.getElementById('text-input');
            const outputDiv = document.getElementById('outputDiv');
            const resultsDiv = document.getElementById('detected-tags');
            const tagCounter = document.getElementById('tagCounter');
            const charCount = document.getElementById('charCount');
            
            // Null checks
            if (!textInput || !outputDiv || !resultsDiv || !tagCounter || !charCount) {
                console.error('Required DOM elements not found');
                return;
            }

            const originalText = textInput.value;
            const inputText = originalText.toLowerCase();
            const detectedTags = [];
            const keywords = [];
            const keywordToTagMap = {}; // Map keywords to their tags
            const tagToKeywordsMap = {}; // Map tags to their detected keywords

            function containsWholeWord(text, word) {
                const escapedWord = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`\\b${escapedWord}\\b`, 'i');
                return regex.test(text);
            }

            for (const [tag, synonyms] of Object.entries(tags)) {
                for (const synonym of synonyms) {
                    if (containsWholeWord(inputText, synonym)) {
                        if (!detectedTags.includes(tag)) {
                            detectedTags.push(tag);
                        }
                        if (!keywords.includes(synonym)) {
                            keywords.push(synonym);
                        }
                        // Map the keyword to its tag (lowercase for matching)
                        keywordToTagMap[synonym.toLowerCase()] = tag;
                        
                        // Map the tag to its detected keywords
                        if (!tagToKeywordsMap[tag]) {
                            tagToKeywordsMap[tag] = [];
                        }
                        if (!tagToKeywordsMap[tag].includes(synonym)) {
                            tagToKeywordsMap[tag].push(synonym);
                        }
                    }
                }
            }

            const highlightKeywords = (text) => {
                if (keywords.length === 0) return escapeHtml(text);
                
                // Escape all keywords for safe regex usage
                const escapedKeywords = keywords.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
                
                // Try to use negative lookbehind if supported, fallback to word boundary
                let regex;
                try {
                    regex = new RegExp(`(?<!\\w)(${escapedKeywords.join('|')})(?!\\w)`, 'gi');
                } catch (e) {
                    // Fallback for older browsers that don't support lookbehind
                    regex = new RegExp(`\\b(${escapedKeywords.join('|')})\\b`, 'gi');
                }
                
                return escapeHtml(text).replace(regex, (match) => {
                    // Find the tag for this keyword
                    const tag = keywordToTagMap[match.toLowerCase()];
                    const tooltipText = tag ? escapeHtml(tag) : '';
                    return `<span class="bg-blue-200 text-blue-900 rounded font-semibold cursor-help" title="${tooltipText}">${match}</span>`;
                });
            };

            const textWithLineBreaks = originalText.replace(/\n/g, '\n');
            const highlightedText = highlightKeywords(textWithLineBreaks);
            outputDiv.innerHTML = highlightedText.replace(/\n/g, '<br>');

            // Update character count
            charCount.textContent = `${originalText.length} characters`;

            if (detectedTags.length > 0) {
                resultsDiv.innerHTML = detectedTags.map(tag => {
                    const colorClass = tagColorMap[tag] || 'bg-gray-100 text-gray-800 border-gray-300';
                    const escapedTag = escapeHtml(tag);
                    const detectedWords = tagToKeywordsMap[tag] || [];
                    const detectedWordsText = detectedWords.map(w => escapeHtml(w)).join(', ');
                    
                    return `<div class="px-4 py-3 rounded-lg border-2 ${colorClass} transition-all duration-200 transform hover:scale-102 shadow-md">
                        <div class="flex items-center mb-1">
                            <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                            </svg>
                            <span class="text-sm font-semibold">${escapedTag}</span>
                        </div>
                        <div class="ml-8 text-xs text-gray-500 italic">${detectedWordsText}</div>
                    </div>`;
                }).join('');
                tagCounter.textContent = `${detectedTags.length}`;
                tagCounter.className = 'px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-xs font-semibold animate-pulse-slow';
            } else {
                resultsDiv.innerHTML = '<div class="text-gray-400 text-sm italic text-center py-8">Start typing to see detected tags...</div>';
                tagCounter.textContent = '0';
                tagCounter.className = 'px-3 py-1 bg-primary-100 text-primary-800 rounded-full text-xs font-semibold';
            }
        }

        const textInputElement = document.getElementById('text-input');
        if (textInputElement) {
            textInputElement.addEventListener('input', detectTags);
        }

        // Sync scroll between textarea and outputDiv
        const textInputForScroll = document.getElementById('text-input');
        const outputDivForScroll = document.getElementById('outputDiv');
        
        if (textInputForScroll && outputDivForScroll) {
            textInputForScroll.addEventListener('scroll', () => {
                outputDivForScroll.scrollTop = textInputForScroll.scrollTop;
                outputDivForScroll.scrollLeft = textInputForScroll.scrollLeft;
            });
        }

        // Clear button
        const clearBtn = document.getElementById('clearBtn');
        if (clearBtn) {
            clearBtn.addEventListener('click', () => {
                const textInput = document.getElementById('text-input');
                if (textInput) {
                    textInput.value = '';
                    detectTags();
                }
            });
        }

        // Example texts - fallback if JSON file not available
        const defaultExamples = [
            {
                "title": "Crime Report",
                "value": "At 10:45 PM, officers responded to a wreck near Elm Street and Maple Avenue. A disoriented male suspect was found next to an overturned electric scooter. Nearby, signs of a break-in were discovered, and surveillance footage linked the suspect to the crime. A search of his backpack revealed a firearm and methamphetamine. He was arrested for unlawful firearm possession, drug possession, and breaking and entering. The suspect was transported for questioning, and the case remains under investigation."
            },
            {
                "title": "Traffic Incident",
                "value": "Officers initiated a traffic stop at the intersection of Main Street and Highway 101 at approximately 2:30 AM. The driver exhibited signs of impairment and failed a field sobriety test. A breathalyzer test confirmed the driver was driving under the influence with a blood alcohol content above the legal limit. The driver was arrested for DUI and the vehicle was towed. A traffic project team documented the incident for future enforcement initiatives."
            },
            {
                "title": "Residential Burglary",
                "value": "Homeowners reported a residential break-in at their residence on 456 Oak Avenue. Multiple items were stolen including electronics, jewelry, and cash. Surveillance footage captured an unhoused individual breaking and entering through the rear door. Officers discovered evidence of trespassing on neighboring properties. The case is being investigated as part of a series of residential burglaries in the area."
            },
            {
                "title": "Drone Surveillance",
                "value": "RTCC surveillance assist identified a drone spotted flying over restricted airspace near the downtown area. The unmanned aerial vehicle was tracked and located near the city park. Officers responded to the scene and the drone was found abandoned. The UAV was registered to a local resident who claimed it malfunctioned. A report was filed documenting the drone located incident."
            },
            {
                "title": "Mental Health Crisis",
                "value": "Officers responded to a call at 1200 Pine Street regarding an individual experiencing emotional distress and psychological well-being concerns. The subject was exhibiting signs of a mental health crisis including mood swings and cognitive function issues. Mental health grant resources were contacted and a crisis intervention team arrived. The individual received psychiatric evaluation and was transported to a medical facility for further mental status assessment."
            },
            {
                "title": "License Plate Hit",
                "value": "RTCC alert - license plate hit confirmed on a vehicle traveling southbound on Interstate 5. The plate match indicated the vehicle was reported stolen from Portland last week. Officers initiated pursuit and successfully conducted a traffic stop. The driver was arrested for vehicle theft. Real-time crime control communication enabled rapid response and vehicle recovery. The case demonstrates effective RTCC surveillance assist capabilities."
            }
        ];

        // Color schemes for example cards
        const exampleColorSchemes = [
            { header: 'from-red-50 to-orange-50', border: 'border-red-200' },
            { header: 'from-blue-50 to-cyan-50', border: 'border-blue-200' },
            { header: 'from-purple-50 to-pink-50', border: 'border-purple-200' },
            { header: 'from-green-50 to-emerald-50', border: 'border-green-200' },
            { header: 'from-indigo-50 to-blue-50', border: 'border-indigo-200' },
            { header: 'from-yellow-50 to-amber-50', border: 'border-yellow-200' }
        ];

        // Variable to store loaded examples
        let examples = defaultExamples;

        // Variables to control typing animation
        let isTyping = false;
        let typingId = 0;

        // Function to stop ongoing typing
        function stopTyping() {
            typingId++;
            isTyping = false;
        }

        // Function to simulate typing effect
        async function simulateTyping(inputElement, text, speed = 5) {
            // Assign a unique ID to this typing session
            const myTypingId = ++typingId;
            isTyping = true;
            
            inputElement.value = '';
            let currentText = '';
            
            for (let i = 0; i < text.length; i++) {
                // Check if this typing session was cancelled
                if (myTypingId !== typingId || !isTyping) {
                    return;
                }
                
                currentText += text[i];
                inputElement.value = currentText;
                
                // Trigger input event to update tags
                detectTags();
                
                // Scroll to keep cursor visible
                inputElement.scrollTop = inputElement.scrollHeight;
                
                // Wait for the typing speed (milliseconds per character)
                await new Promise(resolve => setTimeout(resolve, speed));
            }
            
            // Final scroll to bottom after typing completes
            inputElement.scrollTop = inputElement.scrollHeight;
            isTyping = false;
        }

        // Render examples dynamically
        function renderExamples(examplesData) {
            const examplesContainer = document.getElementById('examples-container');
            if (!examplesContainer) return;

            examplesContainer.innerHTML = examplesData.map((example, index) => {
                const colorScheme = exampleColorSchemes[index % exampleColorSchemes.length];
                const truncatedText = example.value.length > 150 
                    ? example.value.substring(0, 150) + '...' 
                    : example.value;

                return `
                    <div class="glass-morphism rounded-xl shadow-lg overflow-hidden border border-white/20 hover:shadow-xl transition-shadow duration-200">
                        <div class="bg-gradient-to-r ${colorScheme.header} px-6 py-3 border-b ${colorScheme.border}">
                            <h3 class="font-bold text-gray-800 text-sm">${escapeHtml(example.title)}</h3>
                        </div>
                        <div class="p-6 bg-white">
                            <p class="text-gray-600 text-sm leading-relaxed mb-4 line-clamp-4 min-h-[5rem]">
                                ${escapeHtml(truncatedText)}
                            </p>
                            <button data-example="${index}" class="load-example-btn w-full px-4 py-2 bg-primary-500 text-white text-sm font-medium rounded-lg hover:bg-primary-600 transition-colors duration-200 shadow-md">
                                Load Example
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            // Attach event listeners to dynamically created buttons
            document.querySelectorAll('.load-example-btn').forEach(button => {
                button.addEventListener('click', async (e) => {
                    const exampleNum = parseInt(e.target.getAttribute('data-example'));
                    const example = examples[exampleNum];
                    const textInput = document.getElementById('text-input');
                    if (textInput && example) {
                        // Stop any ongoing typing animation
                        stopTyping();
                        
                        // Clear the input first
                        textInput.value = '';
                        detectTags();
                        
                        // Scroll to textbox
                        textInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        
                        // Wait 1 second and start typing
                        await new Promise(resolve => setTimeout(resolve, 1000));
                        
                        // Simulate typing (it will check if cancelled internally)
                        await simulateTyping(textInput, example.value);
                    }
                });
            });
        }

        // Load examples from JSON file or use defaults
        async function loadExamples() {
            try {
                const response = await fetch('examples.json');
                if (response.ok) {
                    const jsonExamples = await response.json();
                    examples = jsonExamples;
                    console.log('Examples loaded from examples.json');
                    renderExamples(examples);
                } else {
                    console.log('examples.json not found, using default examples');
                    renderExamples(defaultExamples);
                }
            } catch (error) {
                console.log('Error loading examples.json, using default examples:', error);
                renderExamples(defaultExamples);
            }
        }

        // Load examples on page load
        loadExamples();

        // Speech recognition
        const startBtn = document.getElementById('startBtn');
        const textOutput = document.getElementById('text-input');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition && startBtn && textOutput) {
            // Show the button only if speech recognition is supported
            startBtn.classList.remove('hidden');
            const recognition = new SpeechRecognition();
            let isListening = false;
            let silenceTimer = null;

            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            function stopDictation() {
                try {
                    recognition.stop();
                } catch (e) {
                    console.error('Error stopping recognition:', e);
                }
                isListening = false;
                if (silenceTimer) {
                    clearTimeout(silenceTimer);
                    silenceTimer = null;
                }
                startBtn.innerHTML = '<svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z" clip-rule="evenodd"/></svg>Dictate';
                startBtn.className = 'inline-flex items-center px-6 py-3 ml-4 bg-gradient-to-r from-primary-500 to-purple-600 text-white font-semibold rounded-lg hover:from-primary-600 hover:to-purple-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transform hover:scale-105 transition-all duration-200 shadow-lg';
            }

            recognition.onresult = (event) => {
                const transcript = Array.from(event.results)
                    .map(result => result[0].transcript)
                    .join('');
                textOutput.value += transcript + ' ';
                detectTags();

                if (silenceTimer) {
                    clearTimeout(silenceTimer);
                }
                silenceTimer = setTimeout(() => {
                    stopDictation();
                }, SILENCE_TIMEOUT_MS);
            };

            recognition.onend = () => {
                if (isListening) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.error('Recognition restart failed:', e);
                        stopDictation();
                    }
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    alert('Microphone access denied. Please allow microphone access in your browser settings.');
                } else if (event.error === 'no-speech') {
                    // Don't show error for no-speech, just continue
                    console.log('No speech detected, continuing...');
                    return;
                }
                stopDictation();
            };

            startBtn.addEventListener('click', () => {
                if (!isListening) {
                    try {
                        recognition.start();
                        isListening = true;
                        startBtn.innerHTML = '<svg class="w-5 h-5 mr-2 animate-pulse" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clip-rule="evenodd"/></svg>Stop';
                        startBtn.className = 'inline-flex items-center px-6 py-3 ml-4 bg-gradient-to-r from-red-600 to-pink-600 text-white font-semibold rounded-lg hover:from-red-700 hover:to-pink-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transform hover:scale-105 transition-all duration-200 shadow-lg';
                    } catch (e) {
                        console.error('Failed to start recognition:', e);
                        alert('Failed to start speech recognition. Error: ' + e.message);
                    }
                } else {
                    stopDictation();
                }
            });
        }
    </script>
</body>
</html>
